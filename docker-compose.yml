services:
  compras:
    image: elixir:otp-27-alpine
    container_name: compras
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      SERVER_TO_RUN: Libremarket.Compras.Server
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
      CLOUDAMQP_URL: ${CLOUDAMQP_URL}
    command: iex --sname compras --cookie secret -S mix
    # para habilitar -it
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"

  infracciones:
    image: elixir:otp-27-alpine
    container_name: infracciones
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      SERVER_TO_RUN: Libremarket.Infracciones.Server
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
      CLOUDAMQP_URL: ${CLOUDAMQP_URL}
    command: iex --sname infracciones --cookie secret -S mix
    # para habilitar -it
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"

  envios:
    image: elixir:otp-27-alpine
    container_name: envios
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      SERVER_TO_RUN: Libremarket.Envios.Server
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
      CLOUDAMQP_URL: ${CLOUDAMQP_URL}
    command: iex --sname envios --cookie secret -S mix
    # para habilitar -it
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"

