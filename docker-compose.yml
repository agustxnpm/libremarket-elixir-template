# Los servicios se comunican solo por AMQP: los nodos no usan distribucion de
# Erlang (sin --sname ni --cookie), asi no queda un puerto de distribucion
# protegido por una cookie fija. Para entrar a la consola: ./libremarket.sh iex <servicio>.
services:
  compras:
    image: elixir:otp-27-alpine
    container_name: compras
    volumes:
      - ./:/app
    working_dir: /app
    restart: unless-stopped
    environment:
      SERVER_TO_RUN: Libremarket.Compras.Server
      MIX_HOME: /app/mix_home
      HEX_HOME: /app/hex_home
      API_TOKEN: ${API_TOKEN:-}
      HTTP_PORT: ${HTTP_PORT:-4000}
      CLOUDAMQP_URL: ${CLOUDAMQP_URL}
      AMQP_SSL_VERIFY: ${AMQP_SSL_VERIFY:-}
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${HTTP_PORT:-4000}:${HTTP_PORT:-4000}"
    command: iex -S mix
    # para habilitar -it
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"

  infracciones:
    image: elixir:otp-27-alpine
    container_name: infracciones
    volumes:
      - ./:/app
    working_dir: /app
